name: Deploy GDL V2 Staging # Force Trigger

on:
  push:
    branches: [develop, test_suit_implementation]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Run Go Unit Tests
        run: |
          for dir in services/go/*/; do
            if [ -f "$dir/go.mod" ]; then
              echo "Testing Go service in $dir"
              cd $dir && go test ./... && cd -
            fi
          done

      - name: Run TypeScript Unit Tests
        run: |
          for dir in services/typescript/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "Testing TS service in $dir"
              # Create dummy .env for tests if needed
              touch "$dir/.env"
              cd $dir && npm install --legacy-peer-deps && npm test || echo "No tests found" && cd -
            fi
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Lint Go
        run: |
          for dir in services/go/*/; do
            if [ -f "$dir/go.mod" ]; then
              echo "Linting Go service in $dir"
              cd $dir && go vet ./... && cd -
            fi
          done

      - name: Lint TypeScript
        run: npx eslint "services/typescript/**/*.ts" --max-warnings 0

  build_and_push:
    needs: [test, lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            identity-service,
            account-service,
            audit-service,
            bankone-connector,
            compliance-service,
            notification-service,
            reporting-service,
            symplus-connector,
            symplus-service,
            transaction-service,
            api-gateway,
            dms-service,
            flexi-service,
            hpa-service,
            investment-service,
            loan-service,
            saveinvest-service,
            user-service,
          ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login

      - name: Build and Push Service
        run: |
          SERVICE_NAME="${{ matrix.service }}"
          MAX_RETRIES=3

          build_and_push() {
            local attempt=$1
            echo "Attempt $attempt of $MAX_RETRIES..."
            
            if [ -d "./services/go/$SERVICE_NAME" ]; then
              docker build --platform linux/amd64 \
                -t registry.digitalocean.com/gdlfinancev2/$SERVICE_NAME:staging \
                --build-arg SERVICE_DIR=$SERVICE_NAME \
                -f ./services/go/$SERVICE_NAME/Dockerfile \
                ./services/go
            elif [ -d "./services/typescript/$SERVICE_NAME" ]; then
              docker build --platform linux/amd64 \
                -t registry.digitalocean.com/gdlfinancev2/$SERVICE_NAME:staging \
                -f ./services/typescript/$SERVICE_NAME/Dockerfile \
                .
            fi
            
            docker push registry.digitalocean.com/gdlfinancev2/$SERVICE_NAME:staging
          }

          for i in $(seq 1 $MAX_RETRIES); do
            if build_and_push $i; then
              echo "Build and push successful!"
              exit 0
            else
              echo "Build or push failed. Retrying in 15s..."
              sleep 15
            fi
          done
          echo "Final attempt failed after $MAX_RETRIES retries."
          exit 1

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Auto-Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: "5m"
          script: |
            mkdir -p /root/gdl-v2
            cd /root/gdl-v2

            # Clone or update repo
            if [ ! -f "docker-compose.staging.yml" ]; then
              git clone https://github.com/gdl-developer/gdl-finance-v2.git .
            else
              git pull origin develop
            fi

            # Log in to registry
            doctl registry login

            # Run the full deployment sequence in the background
            # Note: -v is used to clear old volumes for the Zookeeper -> KRaft transition
            nohup bash -c "
              docker compose -f docker-compose.staging.yml down -v --remove-orphans &&
              docker compose -f docker-compose.staging.yml pull &&
              docker compose -f docker-compose.staging.yml up -d &&
              docker image prune -f
            " > /root/deploy.log 2>&1 &

            echo "Deployment started in background. Check /root/deploy.log for status."
