name: Deploy GDL V2 Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Run Go Unit Tests
        run: |
          for dir in services/go/*/; do
            if [ -f "$dir/go.mod" ]; then
              echo "Testing Go service in $dir"
              cd $dir && go test ./... && cd -
            fi
          done

      - name: Run TypeScript Unit Tests
        run: |
          for dir in services/typescript/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "Testing TS service in $dir"
              cd $dir && npm install --legacy-peer-deps && npm test || echo "No tests found" && cd -
            fi
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Lint Go
        run: |
          for dir in services/go/*/; do
            if [ -f "$dir/go.mod" ]; then
              echo "Linting Go service in $dir"
              cd $dir && go vet ./... && cd -
            fi
          done

      - name: Lint TypeScript
        run: npx eslint "services/typescript/**/*.ts" --max-warnings 0

  build_and_push:
    needs: [test, lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            identity-service,
            account-service,
            audit-service,
            bankone-connector,
            compliance-service,
            notification-service,
            reporting-service,
            symplus-connector,
            symplus-service,
            transaction-service,
            api-gateway,
            dms-service,
            flexi-service,
            hpa-service,
            investment-service,
            loan-service,
            saveinvest-service,
            user-service,
          ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Build and Push Service
        run: |
          SERVICE_NAME="${{ matrix.service }}"

          # Check Go services first
          if [ -d "./services/go/$SERVICE_NAME" ]; then
            docker build --platform linux/amd64 -t registry.digitalocean.com/gdlfinancev2/$SERVICE_NAME:staging --build-arg SERVICE_DIR=$SERVICE_NAME -f ./services/go/$SERVICE_NAME/Dockerfile ./services/go
          # Check TS services
          elif [ -d "./services/typescript/$SERVICE_NAME" ]; then
            docker build --platform linux/amd64 -t registry.digitalocean.com/gdlfinancev2/$SERVICE_NAME:staging ./services/typescript/$SERVICE_NAME
          # Check root User-Service (now moved inside the repo)
          elif [ "$SERVICE_NAME" == "user-service" ]; then
            docker build --platform linux/amd64 -t registry.digitalocean.com/gdlfinancev2/user-service:staging ./services/typescript/user-service
          fi

          docker push registry.digitalocean.com/gdlfinancev2/$SERVICE_NAME:staging

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Auto-Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/root/gdl-v2
            cd /home/root/gdl-v2
            # Log in and update
            doctl registry login
            # Pull images from the registry
            docker-compose -f docker-compose.staging.yml pull
            # Start the hardened services
            docker-compose -f docker-compose.staging.yml up -d
            # Cleanup
            docker image prune -f
