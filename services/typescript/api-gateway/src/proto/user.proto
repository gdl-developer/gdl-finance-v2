syntax = "proto3";

package identity;

option go_package = "github.com/gdl/identity-service/proto";

service IdentityService {
  rpc Register (RegisterRequest) returns (RegisterResponse) {}
  rpc Login (LoginRequest) returns (LoginResponse) {}
  rpc VerifyOTP (VerifyOTPRequest) returns (VerifyOTPResponse) {}
  rpc GetProfile (GetProfileRequest) returns (GetProfileResponse) {}
  rpc ForgotPassword (ForgotPasswordRequest) returns (ForgotPasswordResponse) {}
  
  // RBAC Management
  rpc CreateRole (CreateRoleRequest) returns (CreateRoleResponse) {}
  rpc AssignRole (AssignRoleRequest) returns (AssignRoleResponse) {}
  rpc GetRoles (GetRolesRequest) returns (GetRolesResponse) {}
  
  // Business Unit & Branch Management
  rpc CreateBusinessUnit (CreateBusinessUnitRequest) returns (CreateBusinessUnitResponse) {}
  rpc GetBusinessUnits (GetBusinessUnitsRequest) returns (GetBusinessUnitsResponse) {}
}

message CreateBusinessUnitRequest {
  string name = 1;
  string manager_id = 2;
}

message CreateBusinessUnitResponse {
  bool success = 1;
  string unit_id = 2;
}

message GetBusinessUnitsRequest {}

message GetBusinessUnitsResponse {
  repeated BusinessUnitInfo units = 1;
}

message BusinessUnitInfo {
  string id = 1;
  string name = 2;
  string manager_id = 3;
}

message CreateRoleRequest {
  string name = 1;
  repeated string permissions = 2;
}

message CreateRoleResponse {
  bool success = 1;
  string role_id = 2;
}

message AssignRoleRequest {
  string user_id = 1;
  string role_name = 2;
}

message AssignRoleResponse {
  bool success = 1;
}

message GetRolesRequest {}

message GetRolesResponse {
  repeated RoleInfo roles = 1;
}

message RoleInfo {
  string id = 1;
  string name = 2;
  repeated string permissions = 3;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
  string phone_number = 5;
}

message RegisterResponse {
  bool success = 1;
  string message = 2;
  string user_id = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string ip_address = 3;
  string user_agent = 4;
}

message LoginResponse {
  bool success = 1;
  string token = 2;
  string refresh_token = 3;
  bool requires_2fa = 4;
  string message = 5;
}

message VerifyOTPRequest {
  string email = 1;
  string code = 2;
  string type = 3;
}

message VerifyOTPResponse {
  bool success = 1;
  string message = 2;
}

message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  string email = 1;
  string first_name = 2;
  string last_name = 3;
  string phone_number = 4;
  string status = 5;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ForgotPasswordResponse {
  bool success = 1;
  string message = 2;
}
