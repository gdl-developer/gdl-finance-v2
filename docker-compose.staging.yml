services:
  # Infrastructure
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - gdl-net

  zookeeper:
    image: bitnami/zookeeper:3.9
    restart: always
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - gdl-net

  kafka:
    image: bitnami/kafka:3.6
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_BROKER_ID=1
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
    networks:
      - gdl-net

  # Go Services
  identity-service:
    image: registry.digitalocean.com/gdlfinancev2/identity-service:staging
    restart: always
    environment:
      - PORT=50051
    env_file: .env.staging
    depends_on:
      - redis
    networks:
      - gdl-net

  account-service:
    image: registry.digitalocean.com/gdlfinancev2/account-service:staging
    restart: always
    environment:
      - PORT=50052
    env_file: .env.staging
    depends_on:
      - redis
    networks:
      - gdl-net

  audit-service:
    image: registry.digitalocean.com/gdlfinancev2/audit-service:staging
    restart: always
    environment:
      - PORT=50053
    env_file: .env.staging
    depends_on:
      - kafka
    networks:
      - gdl-net

  bankone-connector:
    image: registry.digitalocean.com/gdlfinancev2/bankone-connector:staging
    restart: always
    environment:
      - PORT=50054
    env_file: .env.staging
    networks:
      - gdl-net

  compliance-service:
    image: registry.digitalocean.com/gdlfinancev2/compliance-service:staging
    restart: always
    environment:
      - PORT=50055
    env_file: .env.staging
    networks:
      - gdl-net

  notification-service:
    image: registry.digitalocean.com/gdlfinancev2/notification-service:staging
    restart: always
    environment:
      - PORT=50056
    env_file: .env.staging
    networks:
      - gdl-net

  reporting-service:
    image: registry.digitalocean.com/gdlfinancev2/reporting-service:staging
    restart: always
    environment:
      - PORT=50057
    env_file: .env.staging
    networks:
      - gdl-net

  symplus-connector:
    image: registry.digitalocean.com/gdlfinancev2/symplus-connector:staging
    restart: always
    environment:
      - PORT=50058
    env_file: .env.staging
    networks:
      - gdl-net

  symplus-service:
    image: registry.digitalocean.com/gdlfinancev2/symplus-service:staging
    restart: always
    environment:
      - PORT=50059
    env_file: .env.staging
    networks:
      - gdl-net

  transaction-service:
    image: registry.digitalocean.com/gdlfinancev2/transaction-service:staging
    restart: always
    environment:
      - PORT=50060
    env_file: .env.staging
    depends_on:
      - redis
    networks:
      - gdl-net

  # TypeScript Services
  api-gateway:
    image: registry.digitalocean.com/gdlfinancev2/api-gateway:staging
    restart: always
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    env_file: .env.staging
    depends_on:
      - identity-service
      - account-service
    networks:
      - gdl-net

  dms-service:
    image: registry.digitalocean.com/gdlfinancev2/dms-service:staging
    restart: always
    ports:
      - "3001:3001"
    env_file: .env.staging
    networks:
      - gdl-net

  flexi-service:
    image: registry.digitalocean.com/gdlfinancev2/flexi-service:staging
    restart: always
    ports:
      - "3002:3002"
    env_file: .env.staging
    networks:
      - gdl-net

  hpa-service:
    image: registry.digitalocean.com/gdlfinancev2/hpa-service:staging
    restart: always
    ports:
      - "3003:3003"
    env_file: .env.staging
    networks:
      - gdl-net

  investment-service:
    image: registry.digitalocean.com/gdlfinancev2/investment-service:staging
    restart: always
    ports:
      - "3004:3004"
    env_file: .env.staging
    networks:
      - gdl-net

  loan-service:
    image: registry.digitalocean.com/gdlfinancev2/loan-service:staging
    restart: always
    ports:
      - "3005:3005"
    env_file: .env.staging
    networks:
      - gdl-net

  saveinvest-service:
    image: registry.digitalocean.com/gdlfinancev2/saveinvest-service:staging
    restart: always
    ports:
      - "3006:3006"
    env_file: .env.staging
    networks:
      - gdl-net

  user-service:
    image: registry.digitalocean.com/gdlfinancev2/user-service:staging
    restart: always
    environment:
      - PORT=3080
    ports:
      - "3080:3080"
    env_file: .env.staging
    networks:
      - gdl-net

  symplus-integration-service:
    image: registry.digitalocean.com/gdlfinancev2/symplus-integration-service:staging
    restart: always
    environment:
      - PORT=3010
    ports:
      - "3010:3010"
    env_file: .env.staging
    networks:
      - gdl-net

networks:
  gdl-net:
    driver: bridge

volumes:
  redis_data:
