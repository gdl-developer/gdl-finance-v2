version: "3.8"

services:
  # Infrastructure
  postgres:
    image: postgres:15-alpine
    container_name: gdl-v2-db
    restart: always
    environment:
      POSTGRES_DB: gdl_v2
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gdl-v2-redis
    restart: always
    ports:
      - "6379:6379"

  # Go Services
  identity-service:
    image: registry.digitalocean.com/gdlfinancev2/identity-service:staging
    container_name: gdl-v2-identity
    restart: always
    ports:
      - "50051:50051"
    env_file: .env.staging
    depends_on:
      - postgres
      - redis

  account-service:
    image: registry.digitalocean.com/gdlfinancev2/account-service:staging
    container_name: gdl-v2-account
    restart: always
    ports:
      - "50052:50052"
    env_file: .env.staging
    depends_on:
      - postgres
      - redis

  audit-service:
    image: registry.digitalocean.com/gdlfinancev2/audit-service:staging
    container_name: gdl-v2-audit
    restart: always
    ports:
      - "50053:50053"
    env_file: .env.staging
    depends_on:
      - postgres

  bankone-connector:
    image: registry.digitalocean.com/gdlfinancev2/bankone-connector:staging
    container_name: gdl-v2-bankone
    restart: always
    ports:
      - "50054:50054"
    env_file: .env.staging

  compliance-service:
    image: registry.digitalocean.com/gdlfinancev2/compliance-service:staging
    container_name: gdl-v2-compliance
    restart: always
    ports:
      - "50055:50055"
    env_file: .env.staging
    depends_on:
      - postgres

  notification-service:
    image: registry.digitalocean.com/gdlfinancev2/notification-service:staging
    container_name: gdl-v2-notification
    restart: always
    ports:
      - "50056:50056"
    env_file: .env.staging

  reporting-service:
    image: registry.digitalocean.com/gdlfinancev2/reporting-service:staging
    container_name: gdl-v2-reporting
    restart: always
    ports:
      - "50057:50057"
    env_file: .env.staging
    depends_on:
      - postgres

  symplus-connector:
    image: registry.digitalocean.com/gdlfinancev2/symplus-connector:staging
    container_name: gdl-v2-symplus-conn
    restart: always
    ports:
      - "50058:50058"
    env_file: .env.staging

  symplus-service:
    image: registry.digitalocean.com/gdlfinancev2/symplus-service:staging
    container_name: gdl-v2-symplus
    restart: always
    ports:
      - "50059:50059"
    env_file: .env.staging
    depends_on:
      - postgres

  transaction-service:
    image: registry.digitalocean.com/gdlfinancev2/transaction-service:staging
    container_name: gdl-v2-transaction
    restart: always
    ports:
      - "50060:50060"
    env_file: .env.staging
    depends_on:
      - postgres
      - redis

  # TypeScript Services
  api-gateway:
    image: registry.digitalocean.com/gdlfinancev2/api-gateway:staging
    container_name: gdl-v2-gateway
    restart: always
    ports:
      - "3000:3000"
    env_file: .env.staging
    depends_on:
      - identity-service
      - account-service

  dms-service:
    image: registry.digitalocean.com/gdlfinancev2/dms-service:staging
    container_name: gdl-v2-dms
    restart: always
    ports:
      - "3001:3001"
    env_file: .env.staging

  flexi-service:
    image: registry.digitalocean.com/gdlfinancev2/flexi-service:staging
    container_name: gdl-v2-flexi
    restart: always
    ports:
      - "3002:3002"
    env_file: .env.staging

  hpa-service:
    image: registry.digitalocean.com/gdlfinancev2/hpa-service:staging
    container_name: gdl-v2-hpa
    restart: always
    ports:
      - "3003:3003"
    env_file: .env.staging

  investment-service:
    image: registry.digitalocean.com/gdlfinancev2/investment-service:staging
    container_name: gdl-v2-investment
    restart: always
    ports:
      - "3004:3004"
    env_file: .env.staging

  loan-service:
    image: registry.digitalocean.com/gdlfinancev2/loan-service:staging
    container_name: gdl-v2-loan
    restart: always
    ports:
      - "3005:3005"
    env_file: .env.staging

  saveinvest-service:
    image: registry.digitalocean.com/gdlfinancev2/saveinvest-service:staging
    container_name: gdl-v2-saveinvest
    restart: always
    ports:
      - "3006:3006"
    env_file: .env.staging

  user-service:
    image: registry.digitalocean.com/gdlfinancev2/user-service:staging
    container_name: gdl-v2-user
    restart: always
    ports:
      - "3080:3080"
    env_file: .env.staging

volumes:
  pg_data:
