services:
  # Infrastructure
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:latest
    restart: always
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Go Services
  identity-service:
    image: registry.digitalocean.com/gdlfinancev2/identity-service:staging
    restart: always
    environment:
      - PORT=50051
    env_file: .env.staging
    depends_on:
      - redis

  account-service:
    image: registry.digitalocean.com/gdlfinancev2/account-service:staging
    restart: always
    environment:
      - PORT=50052
    env_file: .env.staging
    depends_on:
      - redis

  audit-service:
    image: registry.digitalocean.com/gdlfinancev2/audit-service:staging
    restart: always
    environment:
      - PORT=50053
    env_file: .env.staging
    depends_on:
      - kafka

  bankone-connector:
    image: registry.digitalocean.com/gdlfinancev2/bankone-connector:staging
    restart: always
    environment:
      - PORT=50054
    env_file: .env.staging

  compliance-service:
    image: registry.digitalocean.com/gdlfinancev2/compliance-service:staging
    restart: always
    environment:
      - PORT=50055
    env_file: .env.staging

  notification-service:
    image: registry.digitalocean.com/gdlfinancev2/notification-service:staging
    restart: always
    environment:
      - PORT=50056
    env_file: .env.staging

  reporting-service:
    image: registry.digitalocean.com/gdlfinancev2/reporting-service:staging
    restart: always
    environment:
      - PORT=50057
    env_file: .env.staging

  symplus-connector:
    image: registry.digitalocean.com/gdlfinancev2/symplus-connector:staging
    restart: always
    environment:
      - PORT=50058
    env_file: .env.staging

  symplus-service:
    image: registry.digitalocean.com/gdlfinancev2/symplus-service:staging
    restart: always
    environment:
      - PORT=50059
    env_file: .env.staging

  transaction-service:
    image: registry.digitalocean.com/gdlfinancev2/transaction-service:staging
    restart: always
    environment:
      - PORT=50060
    env_file: .env.staging
    depends_on:
      - redis

  # TypeScript Services
  api-gateway:
    image: registry.digitalocean.com/gdlfinancev2/api-gateway:staging
    restart: always
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    env_file: .env.staging
    depends_on:
      - identity-service
      - account-service

  dms-service:
    image: registry.digitalocean.com/gdlfinancev2/dms-service:staging
    restart: always
    ports:
      - "3001:3001"
    env_file: .env.staging

  flexi-service:
    image: registry.digitalocean.com/gdlfinancev2/flexi-service:staging
    restart: always
    ports:
      - "3002:3002"
    env_file: .env.staging

  hpa-service:
    image: registry.digitalocean.com/gdlfinancev2/hpa-service:staging
    restart: always
    ports:
      - "3003:3003"
    env_file: .env.staging

  investment-service:
    image: registry.digitalocean.com/gdlfinancev2/investment-service:staging
    restart: always
    ports:
      - "3004:3004"
    env_file: .env.staging

  loan-service:
    image: registry.digitalocean.com/gdlfinancev2/loan-service:staging
    restart: always
    ports:
      - "3005:3005"
    env_file: .env.staging

  saveinvest-service:
    image: registry.digitalocean.com/gdlfinancev2/saveinvest-service:staging
    restart: always
    ports:
      - "3006:3006"
    env_file: .env.staging

  user-service:
    image: registry.digitalocean.com/gdlfinancev2/user-service:staging
    restart: always
    environment:
      - PORT=3080
    ports:
      - "3080:3080"
    env_file: .env.staging

  symplus-integration-service:
    image: registry.digitalocean.com/gdlfinancev2/symplus-integration-service:staging
    restart: always
    environment:
      - PORT=3010
    ports:
      - "3010:3010"
    env_file: .env.staging

volumes:
  pg_data:
